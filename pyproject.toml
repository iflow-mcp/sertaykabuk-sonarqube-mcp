[project]
name = "iflow-mcp_sertaykabuk_sonarqube-mcp"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.0",
]

[project.scripts]
sonarqube-mcp = "sonarqube_mcp.__main__:main"

[project.optional-dependencies]
test = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "strict"
